; HLTV recorder settings. Lines starting with ; are comments.
; Run "Record HLTV.bat" (or: python -I hltv_recorder.py) after editing this file.

[recorder]
; The Half-Life folder that has hltv.exe in it.
halflife_dir = C:\Program Files (x86)\Steam\steamapps\common\Half-Life

; Where finished demos and their player lists go. Relative paths are relative to this file.
output_dir = Recordings

; Add the server label to file names (useful when recording several servers).
label_in_filename = no


; One [server:<label>] section per server to record. Each one runs its own hidden hltv.exe.
; Add more sections to record several servers at once (give each its own hltv_port).

[server:main]
; Game server (or someone else's HLTV proxy) to join, as ip:port.
address =

; Game server password, if it has one.
password =

; Needed only when joining an HLTV proxy that has a proxy password.
proxy_password =

; Local UDP port this recorder's HLTV listens on. Must be free and different per server.
hltv_port = 27120

; Name the HLTV shows on the scoreboard.
name = HLTV Recorder

; Updates per second recorded (the game server's sv_maxupdaterate caps it). Higher = smoother playback, bigger files.
updaterate = 60

; Bandwidth from the game server to the recorder, bytes/second.
rate = 30000

; Broadcast delay in seconds. Keep 0 when joining a game server directly (the demo is then in real time).
; Ignored when joining someone else's HLTV: their master proxy decides the delay.
delay = 0
